name: daily-kb-sync

on:
  schedule:
    - cron: "15 3 * * *"   # every day 03:15 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write           # to commit refreshed articles/ and data/ back to the repo

concurrency:
  group: kb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kb-sync .

      - name: Run daily sync (scrape -> delta upload)
        run: |
          mkdir -p articles data
          docker run --rm \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e FILE_SEARCH_STORE_NAME="${{ vars.FILE_SEARCH_STORE_NAME || 'optibot-kb' }}" \
            -e ARTICLE_LIMIT="${{ vars.ARTICLE_LIMIT || '100' }}" \
            -v "$PWD/articles:/app/articles" \
            -v "$PWD/data:/app/data" \
            kb-sync 2>&1 | tee data/last_run.log

      - name: Sanity question
        run: |
          docker run --rm \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            -e FILE_SEARCH_STORE_NAME="${{ vars.FILE_SEARCH_STORE_NAME || 'optibot-kb' }}" \
            kb-sync --ask "How do I add a YouTube video?" 2>&1 | tee data/last_answer.txt

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: |
            data/
            articles/
          retention-days: 30

      - name: Commit refreshed Markdown + run summary
        run: |
          sudo chown -R "$(id -u):$(id -g)" articles data
          git config user.name "kb-sync-bot"
          git config user.email "kb-sync-bot@users.noreply.github.com"
          counts="$(grep -o 'added=[0-9]* updated=[0-9]* skipped=[0-9]* removed=[0-9]*' data/last_run.log | tail -1)"
          branch="${{ github.ref_name }}"
          # Build the commit on top of the current branch tip instead of rebasing onto it:
          # two runs overlapping (or a re-run of an older run) would otherwise collide in
          # run-history.log, where both append a line to the same end of the file.
          for attempt in 1 2 3; do
            git fetch --quiet origin "$branch"
            git reset --quiet "origin/$branch"        # index -> branch tip, generated files kept
            if git show "origin/$branch:data/run-history.log" > /tmp/remote-history.log 2>/dev/null; then
              {
                head -1 /tmp/remote-history.log
                { tail -n +2 /tmp/remote-history.log; tail -n +2 data/run-history.log; } | sort -u
              } > /tmp/merged-history.log
              mv /tmp/merged-history.log data/run-history.log
            fi
            git add articles data
            if git diff --cached --quiet; then
              echo "No content changes to commit."
              exit 0
            fi
            git commit --quiet -m "chore(sync): daily run #${{ github.run_number }} - $counts"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "push rejected, rebuilding on the new tip ($attempt/3)"
            sleep 5
          done
          exit 1
